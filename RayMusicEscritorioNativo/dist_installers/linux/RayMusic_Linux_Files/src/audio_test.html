<!DOCTYPE html>
<html>
<head><title>Audio Test</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px;">
<h2>Prueba de Audio - RayMusic</h2>
<p>Si no escuchas sonido del video de abajo, el problema es WebView2.</p>
<p>Haz clic en el boton de play del video:</p>
<br>
<iframe width="560" height="315" 
  src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&controls=1" 
  allow="autoplay; encrypted-media; accelerometer; gyroscope" 
  allowfullscreen
  style="border:none;">
</iframe>
<br><br>
<button onclick="testBeep()" style="padding:10px 20px;font-size:16px;cursor:pointer;">
  Probar Sonido del Sistema (Beep)
</button>
<script>
function testBeep() {
  try {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 440;
    osc.connect(ctx.destination);
    osc.start();
    setTimeout(() => osc.stop(), 500);
    document.getElementById('result').textContent = 'AudioContext: Beep emitido!';
  } catch(e) {
    document.getElementById('result').textContent = 'Error: ' + e.message;
  }
}
</script>
<p id="result" style="color:#0f0;font-size:18px;"></p>
</body>
</html>
