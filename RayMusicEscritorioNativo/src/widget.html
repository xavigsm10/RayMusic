<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RayMusic Mini Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0e0204;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      position: relative;
    }
    #widget-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      filter: none;
    }
    .widget-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .mac-dots {
      display: flex;
      gap: 6px;
    }
    .mac-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .pill-tools {
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 4px 10px;
      display: flex;
      gap: 8px;
    }
    .pill-tools button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 12px;
    }
    .widget-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.65) 100%);
      padding: 12px;
      border-radius: 18px;
    }
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .track-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      white-space: nowrap;
      max-width: 200px;
    }
    .track-title {
      font-size: 18px;
      font-weight: 900;
      color: white;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .track-artist {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      text-overflow: ellipsis;
      overflow: hidden;
      margin-top: 2px;
    }
    .action-circle {
      background: rgba(255,255,255,0.25);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slider-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.35);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }
    .slider-progress {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 2px;
    }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
      margin-top: 2px;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin-top: 4px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }
    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      color: black;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <img id="widget-cover" src="" alt="Artwork">

  <div class="widget-header">
    <div class="mac-dots">
      <span class="mac-dot" style="background: #ff5f56; cursor: pointer;" onclick="window.close()"></span>
      <span class="mac-dot" style="background: #ffbd2e;"></span>
      <span class="mac-dot" style="background: #27c93f;"></span>
    </div>
    <div class="pill-tools">
      <button title="Letras">💬</button>
      <button title="Cola">≡</button>
      <button title="Radio">📻</button>
      <button title="Volumen">🔊</button>
    </div>
  </div>

  <div class="widget-content">
    <div class="meta-row">
      <div class="track-info">
        <span class="track-title" id="w-title">RayMusic</span>
        <span class="track-artist" id="w-artist">Reproductor Nivel OS</span>
      </div>
      <div style="display: flex; gap: 6px;">
        <button class="action-circle">★</button>
        <button class="action-circle">•••</button>
      </div>
    </div>

    <div>
      <div class="slider-track" id="w-slider">
        <div class="slider-progress" id="w-prog"></div>
      </div>
      <div class="time-labels">
        <span id="w-el">0:00</span>
        <span id="w-rem">-0:00</span>
      </div>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn" id="w-btn-shuf"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button class="ctrl-btn" id="w-btn-prev"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="play-btn" id="w-btn-play">
        <svg id="w-icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="w-icon-pause" style="display:none;" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn" id="w-btn-next"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg></button>
      <button class="ctrl-btn" id="w-btn-rep"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
  </div>

  <script>
    const bc = new BroadcastChannel('raymusic_ipc');

    bc.onmessage = (e) => {
      const data = e.data;
      if (!data) return;
      if (data.artwork) document.getElementById('widget-cover').src = data.artwork;
      if (data.title) document.getElementById('w-title').textContent = data.title;
      if (data.artist) document.getElementById('w-artist').textContent = data.artist;
      if (data.elapsed !== undefined) document.getElementById('w-el').textContent = data.elapsed;
      if (data.remaining !== undefined) document.getElementById('w-rem').textContent = data.remaining;
      if (data.progress !== undefined) document.getElementById('w-prog').style.width = data.progress + '%';

      if (data.isPlaying !== undefined) {
        document.getElementById('w-icon-play').style.display = data.isPlaying ? 'none' : 'block';
        document.getElementById('w-icon-pause').style.display = data.isPlaying ? 'block' : 'none';
      }
    };

    document.getElementById('w-btn-play').onclick = () => bc.postMessage({ cmd: 'toggle_play' });
    document.getElementById('w-btn-prev').onclick = () => bc.postMessage({ cmd: 'prev' });
    document.getElementById('w-btn-next').onclick = () => bc.postMessage({ cmd: 'next' });
  </script>
</body>
</html>
